# Reusable workflow: deploy the kmail Helm chart to one environment.
#
# The `environment` input binds the job to a GitHub Environment, so
# protection rules (required reviewers / wait timers) configured there
# gate the run — this is how canary and production get manual approval
# without any secrets in the repo. The kubeconfig is supplied by the
# caller as the KUBE_CONFIG secret and written to a temp file.
name: Helm deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (drives approval gates).
        required: true
        type: string
      namespace:
        description: Kubernetes namespace.
        required: true
        type: string
      release_name:
        description: Helm release name.
        required: false
        default: kmail
        type: string
      image:
        description: Fully-qualified image reference to deploy.
        required: true
        type: string
      values_file:
        description: Path to the environment values overlay, relative to the repo root.
        required: true
        type: string
      extra_args:
        description: Extra `helm upgrade` args (e.g. canary --set overrides).
        required: false
        default: ""
        type: string
      dry_run:
        description: Render/diff only — do not apply.
        required: false
        default: false
        type: boolean
    secrets:
      KUBE_CONFIG:
        description: base64-encoded kubeconfig for the target cluster.
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Write kubeconfig
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Resolve image repository and tag
        id: img
        run: |
          ref='${{ inputs.image }}'
          # Split "repo@sha256:..." or "repo:tag" into repository + tag/digest.
          case "$ref" in
            *@*) repo="${ref%@*}"; tag="${ref#*@}" ;;
            *:*) repo="${ref%:*}"; tag="${ref##*:}" ;;
            *)   repo="$ref"; tag="latest" ;;
          esac
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Helm lint (env overlay)
        run: helm lint deploy/helm/kmail --values "${{ inputs.values_file }}"

      - name: Helm diff (dry-run render)
        run: |
          helm template "${{ inputs.release_name }}" deploy/helm/kmail \
            --namespace "${{ inputs.namespace }}" \
            --values "${{ inputs.values_file }}" \
            --set image.repository="${{ steps.img.outputs.repository }}" \
            --set image.tag="${{ steps.img.outputs.tag }}" \
            ${{ inputs.extra_args }} > /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) resources."

      - name: Helm upgrade --install
        if: ${{ !inputs.dry_run }}
        run: |
          helm upgrade --install "${{ inputs.release_name }}" deploy/helm/kmail \
            --namespace "${{ inputs.namespace }}" --create-namespace \
            --values "${{ inputs.values_file }}" \
            --set image.repository="${{ steps.img.outputs.repository }}" \
            --set image.tag="${{ steps.img.outputs.tag }}" \
            ${{ inputs.extra_args }} \
            --atomic --wait --timeout 10m

      - name: Rollout status
        if: ${{ !inputs.dry_run }}
        run: |
          helm status "${{ inputs.release_name }}" --namespace "${{ inputs.namespace }}"
