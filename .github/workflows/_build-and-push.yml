# Reusable workflow: build and push the kmail container image to GHCR.
#
# Called by the deploy workflows so image building lives in exactly one
# place. Emits the fully-qualified image reference (with an immutable
# digest) the callers deploy. No secrets are embedded — GHCR auth uses
# the built-in GITHUB_TOKEN.
name: Build and push image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Tag to apply to the built image (e.g. a git SHA or release tag).
        required: true
        type: string
      push:
        description: Whether to push the image (false = build only, for PR validation).
        required: false
        default: true
        type: boolean
    outputs:
      image:
        description: Fully-qualified image reference including digest.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All ${{ }} values consumed by a `run:` step are bound through `env:`
      # first and referenced as shell variables, never interpolated directly
      # into the script. With the value living in an env var the shell treats
      # it as inert data, so an attacker-influenced input (notably the
      # free-form `image_tag` from a workflow_dispatch deploy) cannot inject
      # shell metacharacters. See _helm-deploy.yml for the same pattern.
      - name: Compute lowercase image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.name.outputs.image }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image reference (by digest)
        id: ref
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$IMAGE_DIGEST" ]; then
            echo "image=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi
