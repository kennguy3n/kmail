# Reusable workflow: build and push the kmail container image to GHCR.
#
# Called by the deploy workflows so image building lives in exactly one
# place. Emits the fully-qualified image reference (with an immutable
# digest) the callers deploy. No secrets are embedded — GHCR auth uses
# the built-in GITHUB_TOKEN.
name: Build and push image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Tag to apply to the built image (e.g. a git SHA or release tag).
        required: true
        type: string
      push:
        description: Whether to push the image (false = build only, for PR validation).
        required: false
        default: true
        type: boolean
    outputs:
      image:
        description: Fully-qualified image reference including digest.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.name.outputs.image }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image reference (by digest)
        id: ref
        run: |
          if [ -n "${{ steps.build.outputs.digest }}" ]; then
            echo "image=${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ steps.name.outputs.image }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi
