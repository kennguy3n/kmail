name: Chaos

# Phase D #11 — chaos engineering workflow. Exercises the SLO
# budget when individual dependencies fail (Stalwart shard restart,
# Postgres pause, Valkey kill) by driving traffic through the BFF
# during the fault window and asserting the error rate stays inside
# the 99.95% SLO target. The harness scripts under
# `scripts/loadtest/chaos-*.sh` are the source of truth for the
# fault injection mechanics; this workflow just wires them up
# against a clean docker compose stack each run.
#
# Triggered on:
#   * Nightly schedule (02:00 UTC) — primary signal.
#   * Manual workflow_dispatch — for on-demand verification.
# NOT triggered on every PR — chaos runs are ~15 minutes and the
# signal-to-noise on a per-PR run is poor (most PRs don't touch
# the failure-handling paths).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  chaos:
    name: Chaos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KMAIL_API_URL: http://localhost:8088
      KMAIL_DEV_BEARER: kmail-dev
      KMAIL_COMPOSE_PROJECT: kmail
      # The chaos scripts read KMAIL_JMAP_URL (default
      # http://localhost:8080 which is the Stalwart container).
      # That default would bypass the BFF entirely and exercise
      # Stalwart directly — useless as a chaos signal, since the
      # whole point is to validate the BFF's circuit breaker,
      # cache, and graceful-degradation behaviour. Pin to the
      # BFF's host port (8088, set by KMAIL_API_ADDR below).
      KMAIL_JMAP_URL: http://localhost:8088
      # The chaos scripts also read KMAIL_AUTH_TOKEN (default
      # kmail-dev). Today the default happens to match the BFF's
      # configured bypass token, so the scripts work, but the
      # two env vars are independent — if someone changes the
      # bypass token they would not realise they had to update
      # the chaos scripts too. Pin both to the same literal here.
      KMAIL_AUTH_TOKEN: kmail-dev
      # The chaos scripts default target containers
      # `${KMAIL_COMPOSE_PROJECT}-<service>-1` (the docker compose
      # auto-generated name pattern). The docker-compose.yml in
      # this repo uses explicit `container_name:` directives that
      # drop the `-1` suffix (kmail-stalwart, kmail-postgres,
      # kmail-valkey). Without these overrides, every chaos
      # scenario would fail with "No such container" before
      # injecting any fault.
      KMAIL_SHARD_CONTAINER: kmail-stalwart
      KMAIL_PG_CONTAINER: kmail-postgres
      KMAIL_VALKEY_CONTAINER: kmail-valkey
      # Loosen the chaos-shard SLO target slightly on CI: a
      # GitHub-hosted runner's IO is significantly noisier than a
      # production cluster, so we'd see false-positive SLO
      # violations from disk stalls rather than from the injected
      # fault. ONLY `scripts/loadtest/chaos-shard.sh` reads this
      # env var; chaos-postgres.sh has its own hardcoded ≥50%
      # success threshold and chaos-valkey.sh has ≥95%, both of
      # which are already CI-friendly so they don't need an
      # override here. Tune this value if the shard scenario's
      # false-positive rate rises; raise a follow-up issue if the
      # postgres/valkey scripts ever need similar knobs.
      KMAIL_CHAOS_SLO_PCT: "0.5"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      # See `.github/workflows/ci.yml` for the rationale: the
      # compose file's `zk-fabric` service builds from a sibling
      # `../zk-object-fabric` path that doesn't exist on a fresh
      # CI runner. Clone it before any compose command runs.
      - name: Clone zk-object-fabric sibling for compose build context
        run: |
          git clone --depth 1 --branch main \
            https://github.com/kennguy3n/zk-object-fabric.git \
            ../zk-object-fabric
          ls -la ../zk-object-fabric | head -10

      # `--ignore-buildable` skips zk-fabric (private GHCR package the
      # CI token can't pull); we build it from the sibling checkout in
      # the next step instead. See ci.yml for the full rationale.
      - name: docker compose pull
        run: docker compose pull --quiet --ignore-buildable

      - name: docker compose build zk-fabric
        run: docker compose build zk-fabric

      - name: docker compose up -d
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose ps

      - name: Wait for init containers
        run: |
          set -e
          for c in kmail-zk-fabric-init kmail-stalwart-init; do
            completed=0
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)"
              code="$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null || echo 0)"
              case "$status" in
                exited)
                  if [ "$code" = "0" ]; then
                    completed=1
                    break
                  fi
                  echo "$c exited with code $code" >&2
                  docker logs "$c" >&2 || true
                  exit 1
                  ;;
                running|created|restarting)
                  sleep 2
                  ;;
                *)
                  sleep 2
                  ;;
              esac
            done
            # Falling through silently here would let the chaos
            # scenarios run against a half-initialized stack and
            # report SLO violations that are actually init bugs,
            # not real chaos signals. Match the ci.yml pattern.
            if [ "$completed" != "1" ]; then
              final_status="$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)"
              echo "$c did not finish within 120s (final status=$final_status)" >&2
              docker logs "$c" >&2 || true
              exit 1
            fi
          done

      - name: Apply migrations
        run: ./scripts/migrate.sh
        env:
          DATABASE_URL: postgresql://kmail:kmail@localhost:5432/kmail

      - name: Build kmail-api
        run: make build

      - name: Start kmail-api (background, port 8088)
        # See ci.yml for the full env-var spelling rationale. Short
        # form: config.go reads bare names today; main.go reads
        # `KMAIL_MEILISEARCH_*` directly via os.Getenv; KMAIL_ENV is
        # set in anticipation of PR #31's `getenvKMail("ENV")` path.
        # A chaos run with the wrong spelling would silently fall
        # back to defaults — Valkey -> `valkey:6379` (unresolvable
        # from the host runner), Meilisearch -> off entirely — so
        # the chaos scenarios would measure connection-refused from
        # a broken baseline rather than the injected fault. Even
        # though config.go's STALWART_URL default now matches the
        # docker-compose publish (host :8080), the pinned override
        # below documents the contract explicitly.
        env:
          KMAIL_API_ADDR: ":8088"
          KMAIL_ENV: development
          KMAIL_DEV_BYPASS_TOKEN: kmail-dev
          DATABASE_URL: postgresql://kmail:kmail@localhost:5432/kmail
          VALKEY_URL: redis://localhost:6379
          STALWART_URL: http://localhost:8080
          KCHAT_OIDC_ISSUER: ""
          KCHAT_OIDC_AUDIENCE: ""
          ZK_FABRIC_S3_URL: http://localhost:9080
          ZK_FABRIC_ACCESS_KEY: kmail-access-key
          ZK_FABRIC_SECRET_KEY: kmail-secret-key
          KMAIL_MEILISEARCH_URL: http://localhost:7700
          KMAIL_MEILISEARCH_API_KEY: kmail-dev
        run: |
          mkdir -p /tmp/kmail-logs
          nohup ./bin/kmail-api > /tmp/kmail-logs/kmail-api.log 2>&1 &
          echo $! > /tmp/kmail-api.pid

      - name: Wait for kmail-api /healthz
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail "$KMAIL_API_URL/healthz" > /dev/null; then
              echo "kmail-api ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "kmail-api did not become ready in 60s" >&2
          tail -200 /tmp/kmail-logs/kmail-api.log >&2 || true
          exit 1

      # Run each scenario independently so a single failure
      # doesn't mask the rest. `continue-on-error` lets the
      # next step still execute and surface its own pass/fail,
      # but the overall job is failed by the explicit
      # `Aggregate chaos result` step at the end.
      - name: Chaos — Stalwart shard kill
        id: chaos_shard
        continue-on-error: true
        run: ./scripts/loadtest/chaos-shard.sh

      - name: Chaos — Postgres pause
        id: chaos_postgres
        continue-on-error: true
        run: ./scripts/loadtest/chaos-postgres.sh

      - name: Chaos — Valkey kill
        id: chaos_valkey
        continue-on-error: true
        run: ./scripts/loadtest/chaos-valkey.sh

      - name: Aggregate chaos result
        # Each scenario above is `continue-on-error: true` so a
        # single failure doesn't mask the others; this step is the
        # one that fails the job overall when any scenario tripped
        # its SLO budget. Step IDs are statically expanded because
        # GitHub Actions does not support dynamic interpolation of
        # `steps.<id>.outcome` from a bash variable.
        run: |
          fail=0
          if [ "${{ steps.chaos_shard.outcome }}" = "failure" ]; then
            echo "chaos-shard FAILED" >&2
            fail=$((fail+1))
          fi
          if [ "${{ steps.chaos_postgres.outcome }}" = "failure" ]; then
            echo "chaos-postgres FAILED" >&2
            fail=$((fail+1))
          fi
          if [ "${{ steps.chaos_valkey.outcome }}" = "failure" ]; then
            echo "chaos-valkey FAILED" >&2
            fail=$((fail+1))
          fi
          if [ "$fail" -gt 0 ]; then
            echo "$fail chaos scenario(s) failed" >&2
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== kmail-api log ====="
          cat /tmp/kmail-logs/kmail-api.log || true
          echo "===== docker compose ps ====="
          docker compose ps || true
          echo "===== stalwart log (last 200 lines) ====="
          docker logs --tail 200 kmail-stalwart || true
          echo "===== valkey log (last 100 lines) ====="
          docker logs --tail 100 kmail-valkey || true
          echo "===== postgres log (last 100 lines) ====="
          docker logs --tail 100 kmail-postgres || true

      - name: Tear down kmail-api
        if: always()
        run: |
          if [ -f /tmp/kmail-api.pid ]; then
            kill "$(cat /tmp/kmail-api.pid)" 2>/dev/null || true
          fi

      - name: docker compose down
        if: always()
        run: docker compose down -v --remove-orphans
