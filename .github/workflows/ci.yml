name: CI

on:
  push:
    branches: [main]
  # NOTE: we intentionally do NOT use `paths-ignore` here.
  #
  # `paths-ignore` causes the workflow to never fire at all for
  # matching PRs, which means no status check is ever reported.
  # If branch protection requires `CI Status` (the aggregate
  # job at the bottom of this file — and it should), a doc-only
  # PR would be blocked indefinitely with a missing required
  # check. See https://docs.github.com/actions/managing-workflow-runs/skipping-workflow-runs
  # and the discussion in https://github.com/orgs/community/discussions/13690.
  #
  # Instead, the workflow always fires, the cheap `changes` job
  # below runs (one checkout + paths-filter, ~10s), and the
  # subsystem jobs skip via their own `if:` clauses when no
  # relevant files were touched. The aggregate `CI Status` job
  # then reports success because every underlying job was either
  # successful or *legitimately* skipped per the matrix below.
  # Net cost on a doc-only PR: ~15s of runner time vs. ~30min
  # for the full sweep — acceptable for keeping branch
  # protection trivially compatible.
  pull_request:

jobs:
  # `changes` classifies the PR diff into subsystem-scoped buckets
  # so the heavy jobs below can opt out of running when their
  # files weren't touched. Three concerns drive the filter design:
  #
  #  1. False negatives MUST be impossible: anything the go job
  #     actually consumes (Go source, modules, generated SQL
  #     migrations the binary embeds, the Makefile rules the job
  #     literally calls) is in the `go` filter. A pure web PR
  #     therefore skips the Go job legitimately, but a PR that
  #     touches `Makefile` or `migrations/**` re-fires it because
  #     either could change build / test behaviour.
  #  2. On `push` events to main, the downstream jobs unconditionally
  #     fire regardless of the filter outputs. dorny/paths-filter
  #     still performs its normal path matching against the push
  #     diff (it does NOT auto-set outputs to 'true' on push), but
  #     each downstream job's `if:` clause carries an explicit
  #     `github.event_name == 'push'` OR branch that bypasses the
  #     filter result. The post-merge run is the canonical full-
  #     fan-out check; we never want a main-branch commit to skip
  #     a job just because the diff happened to be doc-adjacent.
  #  3. The CI Status aggregate (`ci-status` job at the bottom)
  #     ACCEPTS `result == 'skipped'` for go/web/integration when
  #     the corresponding filter output is 'false'. Branch
  #     protection requires `CI Status` (one stable name); the
  #     underlying jobs may legitimately skip without blocking
  #     the merge.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # The aggregate job reads these outputs to distinguish
    # 'skipped because nothing changed' from 'skipped because of a
    # fork-origin OOM guard'. Both look identical at the job-
    # result level (`result == 'skipped'`), so we need an out-of-
    # band signal to tell them apart.
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      integration: ${{ steps.filter.outputs.integration }}
      helm: ${{ steps.filter.outputs.helm }}
      sdk: ${{ steps.filter.outputs.sdk }}
      desktop: ${{ steps.filter.outputs.desktop }}
      ci_workflows: ${{ steps.filter.outputs.ci_workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `predicate-quantifier: 'every'` would let us require
          # that every glob match — we don't need that; OR-of-
          # globs is the default and correct here.
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            # Integration tests touch the compose stack AND the
            # binary AND the e2e harness AND the migrations the
            # stack applies, so its filter is the union of all
            # of those. The integration job ALSO fires on any
            # change to the integration workflow itself or to
            # the compose / Dockerfile.
            integration:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'Makefile'
              - 'docker-compose.yml'
              - 'Dockerfile*'
              # Scripts the integration job invokes directly OR
              # mounts into the compose stack. `scripts/migrate.sh`
              # is called as an explicit CI step (the "Apply
              # migrations" step below); `scripts/stalwart-init.sh`
              # and `scripts/postgres-init-stalwart.sql` are bind-
              # mounted into the Stalwart / Postgres containers and
              # define their initial state. A PR that only changed
              # one of these would still alter how the integration
              # sweep runs, so listing them explicitly preserves
              # the "False negatives MUST be impossible" invariant
              # documented above. Use a glob over `scripts/**`
              # rather than enumerating individual files so future
              # additions to the integration harness don't silently
              # drift out of CI coverage — the alternative (an
              # ever-growing allow-list) is brittle.
              - 'scripts/**'
              - 'configs/**'
              - '.github/workflows/ci.yml'
            # Helm template changes trigger a `helm template`
            # validation run via the integration job's lint
            # step (it `helm template`s with mTLS enabled to
            # catch shape regressions). Without this filter
            # entry a values.yaml-only PR would skip integration
            # and the template wouldn't get re-rendered.
            helm:
              - 'deploy/helm/**'
            # The kmail-sdk Cargo workspace lives under `sdk/`. The
            # job that runs `cargo test`/`clippy`/`fmt --check`
            # depends on every Rust source file plus the workspace
            # `Cargo.toml`/`Cargo.lock` and any napi / UniFFI
            # build scaffolding under those crate roots. We
            # deliberately do NOT include `apps/**` here because
            # each platform shell has its own per-shell CI workflow
            # (e.g. `.github/workflows/sdk-build-ios.yml` for iOS,
            # which builds the XCFramework on a macOS runner). The
            # sdk job stays ubuntu-only so a pure apps/ios PR
            # doesn't pay the macOS-runner cost twice.
            sdk:
              - 'sdk/**'
              - '.github/workflows/ci.yml'
            # Desktop (Electron + React) Shell.
            #
            # Scoped narrowly to `apps/desktop/**` so an SDK-only
            # PR doesn't trigger the desktop renderer's vitest +
            # vite build dance. The desktop job ALSO fires when
            # `sdk/kmail-napi/**` changes because the renderer's
            # IPC bridge surface is derived from the napi shape
            # — a Rust-side rename to a `#[napi]` method must
            # re-run desktop typecheck.
            desktop:
              - 'apps/desktop/**'
              - 'sdk/kmail-napi/**'
              - '.github/workflows/ci.yml'
            # When the workflow itself changes we re-run
            # everything so we can validate the new YAML
            # actually does what it claims. This is the
            # "belt-and-braces" override that catches the
            # "oops I changed paths-filter and now nothing
            # runs" footgun.
            ci_workflows:
              - '.github/workflows/**'

  go:
    name: Go
    needs: changes
    # Run when: any Go-relevant file changed, OR the workflow
    # itself changed (defence-in-depth against a path filter
    # mistake), OR it's a push to main (full-fan-out invariant).
    if: |
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci_workflows == 'true' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: make tidy
        run: make tidy

      - name: make vet
        run: make vet

      - name: make build
        run: make build

      - name: make test
        run: make test

  sdk:
    name: SDK
    needs: changes
    # Same gating shape as the Go / Web jobs above:
    #   1) the sdk path-filter said files changed,
    #   2) the workflow itself changed (defence-in-depth so a CI
    #      edit always re-runs everything that depends on it),
    #   3) the run is a `push` to main (canonical full fan-out).
    if: |
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.ci_workflows == 'true' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      # Pin to the version the workspace was developed against.
      # `dtolnay/rust-toolchain` is the canonical action — it
      # installs rustup, the requested toolchain, and the named
      # components atomically. `rustfmt` and `clippy` are mandatory
      # for the lint steps below.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # napi-rs / `napi-build` need a Node.js toolchain on PATH to
      # resolve N-API headers when compiling the `kmail-napi`
      # `cdylib` target. Recent napi-rs versions DO bundle the
      # N-API headers via the `napi8` feature, but the build script
      # still shells out to `node -e "process.versions"` to detect
      # the host ABI when generating linker flags. Installing
      # Node.js explicitly here means the `cargo build` step below
      # cannot regress silently if napi-rs ever tightens its host-
      # toolchain requirements. Ubuntu LTS doesn't ship a recent
      # Node, so we use `actions/setup-node` rather than apt.
      - name: Install Node.js toolchain (for napi-rs cdylib build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `Swatinem/rust-cache` caches the registry + target dir
      # keyed on the workspace `Cargo.lock`, which cuts a cold
      # build (~3 min) down to ~30 seconds on subsequent runs.
      # Scoped to the `sdk/` workspace so it doesn't collide
      # with any future Rust workspaces elsewhere in the repo.
      # `key: sdk-job` keeps this job's cache distinct from the
      # `desktop` job (which also builds inside `sdk/`) so the
      # two don't contend on the same save slot.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk -> target
          key: sdk-job

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # `-D warnings` promotes every clippy warning to an error.
        # The crates explicitly opt into `clippy::all` only (NOT
        # `clippy::pedantic`) — see kmail-core/src/lib.rs for the
        # rationale. Pedantic lints flip on stylistic rewrites
        # that fight idiomatic Rust; we want correctness checks,
        # not the linter dictating phrasing.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo build (release sanity)
        # A release build catches optimiser-only issues (overflow
        # checks differ, dead-code elision differs, etc.). Cheap
        # in CI thanks to the cargo cache above.
        run: cargo build --workspace --release

  desktop:
    name: Desktop
    needs: changes
    # Run when any desktop or napi file changed, OR the workflow
    # itself changed, OR it's a push to main. Same shape as the
    # web/sdk/go gates above.
    if: |
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.ci_workflows == 'true' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      # Node 20 LTS matches the @napi-rs/cli host requirement and
      # the Electron 31 bundled Node ABI. The version is pinned
      # so a future setup-node default bump can't silently break
      # the @kmail/sdk-native build pipeline.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        # The desktop job builds @kmail/sdk-native from source
        # because the `file:../../sdk/kmail-napi` workspace
        # dependency resolves to a Cargo crate that has to
        # compile before `npm install` finishes. clippy + rustfmt
        # aren't needed here — the SDK job above covers those.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target (napi build)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk -> target
          # Distinct from the `sdk` job's `sdk-job` key so the
          # two jobs maintain independent caches even when they
          # run in parallel on the same commit.
          key: desktop-job

      - name: Build napi-rs addon (@kmail/sdk-native)
        # The renderer never imports the addon (see vite alias
        # to sdk-native.block.ts), but the *typechecker* needs
        # the napi-rs-generated `index.d.ts` to resolve the
        # `JsClientConfig` / `KMailClientJs` types referenced
        # in electron/preload.ts and electron/main.ts. Running
        # `napi build` here also catches build-side regressions
        # (e.g. a napi-derive macro mismatch) before the desktop
        # job runs.
        working-directory: sdk/kmail-napi
        run: |
          npm install --no-audit --no-fund
          npx @napi-rs/cli build --release --platform

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: npm run typecheck
        # Validates BOTH tsconfigs (renderer + electron). The
        # electron config covers main.ts + preload.ts.
        run: npm run typecheck

      - name: npm run test
        # Renderer-side vitest run. The tests cover wire-format
        # parity with iOS/Android, error-tag parsing, and IPC
        # dispatch via stub bridge.
        run: npm run test

      - name: npm run build:renderer
        # `vite build` exercises the production Rollup bundle
        # path. Catches CSS-imports / TSX-syntax / type-only
        # import regressions that `tsc --noEmit` doesn't flag.
        run: npm run build:renderer

      - name: npm run build:main
        # `tsc -p tsconfig.electron.json` emits CommonJS for
        # the Electron main process. A regression here means
        # the packaged app would fail to boot.
        run: npm run build:main

  web:
    name: Web
    needs: changes
    # Run when: any web-tree file changed, OR the workflow itself
    # changed, OR it's a push to main.
    if: |
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci_workflows == 'true' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for web/package.json
        id: check
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: npm ci

      - name: npm run build
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: npm run build

      - name: npm run test:run
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: npm run test:run

  integration:
    name: Integration
    needs: changes
    # Don't gate on Go/Web here — Phase D #11 calls the integration
    # job out as a parallel CI surface, not a gate. The job
    # exercises the docker compose stack end-to-end and runs the
    # scripts/test-e2e.sh smoke harness against a host-side BFF.
    runs-on: ubuntu-latest
    # Three layers of gating:
    #
    #  1. Fork-origin guard: Stalwart needs ~3GB RAM; a forked-PR
    #     runner often OOMs before the health check passes.
    #     Skip silently on fork-origin PRs; the maintainer fork
    #     covers the surface.
    #  2. Path-filter guard: only fire when go/integration files
    #     actually changed, OR the integration workflow itself.
    #     A web-only PR cannot break the integration stack.
    #  3. Label-gated full sweep: a PR labeled `ci:full` runs
    #     integration unconditionally (still subject to the
    #     fork-origin guard). This lets reviewers force a full
    #     stack check for risky PRs whose diff looks small but
    #     touches load-bearing surfaces (auth, dispatch, etc.).
    #
    # On `push` to main, all guards drop except fork-origin (which
    # can't fire on push events anyway), so the integration job
    # always runs post-merge — the canonical full-fan-out check.
    #
    # BRANCH-PROTECTION NOTE: an entirely-skipped job reports neither
    # success nor failure to GitHub's status API — it is simply
    # absent. To keep this skip safe for any future branch
    # protection rule, the aggregate `ci-status` job at the bottom
    # of this file is the canonical required check. It runs
    # `if: always()`, depends on go/web/integration, and treats
    # `integration.result == 'skipped'` as a pass when the skip is
    # legitimate (fork-origin OR path-filter said "no relevant
    # changes"). Branch protection rules should require
    # `CI Status`, NOT the underlying `Integration` name. See the
    # comment block above `ci-status` for the full rationale.
    if: |
      (github.event.pull_request.head.repo.full_name == github.repository ||
       github.event_name == 'push') &&
      (github.event_name == 'push' ||
       needs.changes.outputs.integration == 'true' ||
       needs.changes.outputs.helm == 'true' ||
       needs.changes.outputs.ci_workflows == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'ci:full'))
    timeout-minutes: 25
    env:
      KMAIL_API_URL: http://localhost:8088
      KMAIL_DEV_BEARER: kmail-dev
      KMAIL_COMPOSE_PROJECT: kmail
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      # The zk-fabric service in `docker-compose.yml` builds from
      # a sibling-repo `build: context: ../zk-object-fabric` path
      # (the canonical local-dev layout per docs/DEVELOPMENT.md).
      # The CI runner only checks out the kmail repo, so the
      # sibling path doesn't exist by default and `docker compose
      # up` would fail with a `path not found` error. Clone the
      # sibling at the path the compose file expects before any
      # compose command runs. `actions/checkout` only writes into
      # $GITHUB_WORKSPACE, so a direct `git clone` is the simplest
      # way to land the repo at `../zk-object-fabric` (which
      # resolves to $GITHUB_WORKSPACE/.. — outside the workspace
      # but on the same runner volume). Pin to `main` for
      # reproducibility without locking integration tests to a
      # stale tag — a zk-object-fabric main breakage surfaces here
      # as an integration failure, which is the correct signal.
      - name: Clone zk-object-fabric sibling for compose build context
        run: |
          git clone --depth 1 --branch main \
            https://github.com/kennguy3n/zk-object-fabric.git \
            ../zk-object-fabric
          ls -la ../zk-object-fabric | head -10

      # The compose stack runs Stalwart + Postgres + Valkey +
      # zk-fabric + Meilisearch + ClamAV in parallel; pulling them
      # up-front saves ~90s on the critical path versus letting
      # `docker compose up` lazy-pull during startup.
      - name: docker compose pull
        run: docker compose pull --quiet

      - name: docker compose up -d
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose ps

      # Wait for the one-shot init containers (zk-fabric-init,
      # stalwart-init) to complete with exit code 0. `--wait`
      # above already blocks on healthy services, but one-shots
      # are reported as `exited (0)` which `--wait` treats as
      # done; this loop is belt-and-braces in case the compose
      # version on the runner predates the `--wait-timeout` flag.
      - name: Wait for init containers
        run: |
          set -e
          for c in kmail-zk-fabric-init kmail-stalwart-init; do
            completed=0
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)"
              code="$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null || echo 0)"
              case "$status" in
                exited)
                  if [ "$code" = "0" ]; then
                    echo "$c completed cleanly"
                    completed=1
                    break
                  fi
                  echo "$c exited with code $code" >&2
                  docker logs "$c" >&2 || true
                  exit 1
                  ;;
                running|created|restarting)
                  sleep 2
                  ;;
                *)
                  echo "$c status=$status; retrying ($i/60)"
                  sleep 2
                  ;;
              esac
            done
            # If the inner loop ran out of iterations without
            # observing an `exited` status, the init container
            # never finished. Falling through silently here would
            # let the rest of the workflow (migrations + e2e) run
            # against an improperly-initialized stack, which is
            # exactly the kind of failure mode that's hard to
            # debug from a green CI run. Fail loud instead.
            if [ "$completed" != "1" ]; then
              final_status="$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)"
              echo "$c did not finish within 120s (final status=$final_status)" >&2
              docker logs "$c" >&2 || true
              exit 1
            fi
          done

      - name: Apply migrations
        run: ./scripts/migrate.sh
        env:
          DATABASE_URL: postgresql://kmail:kmail@localhost:5432/kmail

      - name: Build kmail-api
        run: make build

      - name: Start kmail-api (background, port 8088)
        # Env vars split by which code path reads them:
        #
        # * Vars handled by `internal/config/config.go`'s `getenv`
        #   helper today read the BARE name (no `KMAIL_` prefix).
        #   PR #31 introduces a `getenvKMail` two-form lookup that
        #   accepts both prefixed and bare, but until #31 reaches
        #   `main` the workflow must use the bare name.
        # * Vars handled directly via `os.Getenv("KMAIL_...")` in
        #   `cmd/kmail-api/main.go` (e.g. KMAIL_MEILISEARCH_URL
        #   at main.go:356) have only one accepted spelling: the
        #   `KMAIL_`-prefixed form. Strip the prefix and the
        #   search backend silently disappears at startup.
        # * KMAIL_API_ADDR / KMAIL_DEV_BYPASS_TOKEN are read via
        #   `getenv("KMAIL_...")` in config.go's network/auth
        #   sections (the prefix is part of the canonical name,
        #   not a Helm-only override), so they stay as-is.
        # * KMAIL_ENV is currently unused by the Go binary on
        #   `main`. PR #31 introduces `getenvKMail("ENV")` on the
        #   auth path so once #31 lands `KMAIL_ENV=development`
        #   is what keeps the dev-bypass token alive in CI. Pre-
        #   setting it now is forward-compatible (harmless today,
        #   load-bearing post-merge).
        env:
          KMAIL_API_ADDR: ":8088"
          KMAIL_ENV: development
          KMAIL_DEV_BYPASS_TOKEN: kmail-dev
          DATABASE_URL: postgresql://kmail:kmail@localhost:5432/kmail
          VALKEY_URL: redis://localhost:6379
          STALWART_URL: http://localhost:8080
          KCHAT_OIDC_ISSUER: ""
          KCHAT_OIDC_AUDIENCE: ""
          ZK_FABRIC_S3_URL: http://localhost:9080
          ZK_FABRIC_ACCESS_KEY: kmail-access-key
          ZK_FABRIC_SECRET_KEY: kmail-secret-key
          KMAIL_MEILISEARCH_URL: http://localhost:7700
          KMAIL_MEILISEARCH_API_KEY: kmail-dev
        run: |
          mkdir -p /tmp/kmail-logs
          nohup ./bin/kmail-api > /tmp/kmail-logs/kmail-api.log 2>&1 &
          echo $! > /tmp/kmail-api.pid

      - name: Wait for kmail-api /healthz
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail "$KMAIL_API_URL/healthz" > /dev/null; then
              echo "kmail-api ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "kmail-api did not become ready in 60s" >&2
          tail -200 /tmp/kmail-logs/kmail-api.log >&2 || true
          exit 1

      - name: Run e2e smoke (scripts/test-e2e.sh)
        run: ./scripts/test-e2e.sh

      - name: Dump kmail-api log on failure
        if: failure()
        run: |
          echo "===== kmail-api log ====="
          cat /tmp/kmail-logs/kmail-api.log || true
          echo "===== docker compose ps ====="
          docker compose ps || true
          echo "===== stalwart log (last 200 lines) ====="
          docker logs --tail 200 kmail-stalwart || true
          echo "===== postgres log (last 100 lines) ====="
          docker logs --tail 100 kmail-postgres || true

      - name: Tear down kmail-api
        if: always()
        run: |
          if [ -f /tmp/kmail-api.pid ]; then
            kill "$(cat /tmp/kmail-api.pid)" 2>/dev/null || true
          fi

      - name: docker compose down
        if: always()
        run: docker compose down -v --remove-orphans

  # Aggregate guard job for branch protection. The `integration`
  # job is intentionally skipped on fork-origin PRs (see the
  # comment block above its `if:` — Stalwart's ~3GB memory
  # envelope OOMs forked runners). A bare `Integration` required
  # status check would therefore block every fork PR
  # indefinitely, because GitHub treats a skipped job as
  # *neither* pass nor fail — it is simply absent from the
  # status API, and a required check that never reports cannot
  # be marked green.
  #
  # The canonical fix is a single aggregate job (this one) that:
  #   1. Depends on every subsystem job: go / web / sdk / integration.
  #   2. Runs `if: always()` so it executes even when integration
  #      is skipped on forks (otherwise IT would inherit the
  #      skip and the problem cascades upward).
  #   3. Treats `<subsystem>.result == 'skipped'` as a pass when
  #      the corresponding `needs.changes.outputs.<subsystem>` is
  #      `'false'` — i.e. the path-filter genuinely had no work
  #      for that subsystem. `success` is required when the
  #      subsystem was changed, OR (for `integration`) when the
  #      fork-skip condition fired.
  #   4. Reports its own pass/fail to the status API.
  #
  # Branch protection then requires THIS job (`CI Status`), not
  # the underlying ones. Example outcomes:
  #   fork PR, all subsystems touched:
  #     go: success, web: success, sdk: success,
  #     integration: skipped (fork-OOM guard), ci-status: success
  #   main-repo PR, only the SDK changed:
  #     go: skipped, web: skipped, sdk: success,
  #     integration: skipped, ci-status: success
  #   main-repo PR, every subsystem touched:
  #     go: success, web: success, sdk: success,
  #     integration: success, ci-status: success
  # A real failure of any job correctly fails ci-status because
  # the conditional below requires `!= 'failure'` AND
  # `!= 'cancelled'` for every dependency, regardless of which
  # subsystem the change-detection step said was dirty.
  #
  # The bash arithmetic deliberately fails closed: any result
  # the conditional doesn't recognise (a new GitHub result
  # string) will be caught by the else-branch and reported as
  # failure rather than silently passing.
  ci-status:
    name: CI Status
    if: always()
    needs: [changes, go, web, sdk, desktop, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependent job results
        run: |
          set -euo pipefail
          changes_result='${{ needs.changes.result }}'
          go_result='${{ needs.go.result }}'
          web_result='${{ needs.web.result }}'
          sdk_result='${{ needs.sdk.result }}'
          desktop_result='${{ needs.desktop.result }}'
          integration_result='${{ needs.integration.result }}'
          go_changed='${{ needs.changes.outputs.go }}'
          web_changed='${{ needs.changes.outputs.web }}'
          sdk_changed='${{ needs.changes.outputs.sdk }}'
          desktop_changed='${{ needs.changes.outputs.desktop }}'
          integration_changed='${{ needs.changes.outputs.integration }}'
          helm_changed='${{ needs.changes.outputs.helm }}'
          ci_workflows_changed='${{ needs.changes.outputs.ci_workflows }}'
          event='${{ github.event_name }}'
          ci_full_label='${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}'
          echo "event=${event} changes=${changes_result} go=${go_result}/${go_changed} web=${web_result}/${web_changed} sdk=${sdk_result}/${sdk_changed} desktop=${desktop_result}/${desktop_changed} integration=${integration_result}/${integration_changed} helm=${helm_changed} ci_workflows=${ci_workflows_changed} ci_full_label=${ci_full_label}"

          # If the changes-detection job itself didn't succeed,
          # every downstream job was skipped AND the filter
          # outputs are empty strings. In that state none of the
          # checks below can distinguish 'nothing changed' from
          # 'detection broke' — the empty strings satisfy every
          # `!= 'true'` guard and a legitimate-skip verdict gets
          # silently returned for jobs that never even had a
          # chance to fire. Fail closed: if classification
          # itself broke, `ci-status` must fail.
          if [[ "${changes_result}" != "success" ]]; then
            echo "::error::changes-detection job did not succeed (result=${changes_result}); cannot trust filter outputs — failing CI Status closed"
            exit 1
          fi

          fail=0

          # `go` and `web` may legitimately skip when the path
          # filter said "no relevant changes" (filter output ==
          # 'false') AND the workflow file itself didn't change
          # AND it's not a push to main. The matrix:
          #
          #   result    changed   ci_workflows  event   verdict
          #   success   *         *             *       pass
          #   skipped   false     false         pr      pass  (clean skip)
          #   skipped   true      *             *       FAIL  (job should have run)
          #   skipped   *         true          *       FAIL  (workflow changed, must run)
          #   skipped   *         *             push    FAIL  (push must run everything)
          #   failure   *         *             *       FAIL
          #   cancelled *         *             *       FAIL
          #
          # Encoded inline below for each of go/web.
          check_subsystem() {
            local name="$1" result="$2" changed="$3"
            case "${result}" in
              success)
                return 0
                ;;
              skipped)
                if [[ "${event}" == "push" ]]; then
                  echo "::error::${name} job skipped on push to main — must run on every push"
                  return 1
                fi
                if [[ "${changed}" == "true" ]]; then
                  echo "::error::${name} job skipped even though paths-filter said changes were present"
                  return 1
                fi
                if [[ "${ci_workflows_changed}" == "true" ]]; then
                  echo "::error::${name} job skipped even though CI workflows changed (workflow self-validation invariant)"
                  return 1
                fi
                echo "${name} job skipped legitimately (no relevant changes in this PR)"
                return 0
                ;;
              *)
                echo "::error::${name} job did not succeed (result=${result})"
                return 1
                ;;
            esac
          }

          check_subsystem go "${go_result}" "${go_changed}" || fail=1
          check_subsystem web "${web_result}" "${web_changed}" || fail=1
          check_subsystem sdk "${sdk_result}" "${sdk_changed}" || fail=1
          check_subsystem desktop "${desktop_result}" "${desktop_changed}" || fail=1

          # Integration has an additional legitimate skip path:
          # fork-origin PRs. We can't tell at this layer whether
          # a skip was from path-filter, fork-origin, OR the
          # absence of ci:full label, so accept any 'skipped'
          # provided it wasn't a push (push must always run).
          # The integration job's `if:` clause is what determines
          # whether to run; if that clause is wrong, you'll see
          # it via a missing-coverage failure later in the
          # promotion pipeline (canary / soak), not here.
          case "${integration_result}" in
            success)
              ;;
            skipped)
              if [[ "${event}" == "push" ]]; then
                echo "::error::integration job skipped on push to main — must run on every push"
                fail=1
              else
                echo "integration job skipped (fork-origin, path-filter, or no ci:full label)"
              fi
              ;;
            *)
              echo "::error::integration job did not succeed or skip cleanly (result=${integration_result})"
              fail=1
              ;;
          esac
          exit ${fail}
