# Dependabot keeps dependencies patched across the repo's three
# ecosystems plus the GitHub Actions used by CI. Updates are grouped
# to keep PR volume manageable; security updates are always raised
# individually and promptly by Dependabot regardless of the schedule.
version: 2
updates:
  # Go module (repo root).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "deps(go)"

  # Web frontend (npm).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 10
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "web"]
    commit-message:
      prefix: "deps(web)"

  # Rust SDK (cargo).
  - package-ecosystem: cargo
    directory: "/sdk"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 10
    groups:
      sdk-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "sdk"]
    commit-message:
      prefix: "deps(sdk)"

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(actions)"
