# KMail — default Helm values.
#
# Two top-level deployables: the Go BFF (`kmail-api`) as a
# horizontally scaled Deployment, and Stalwart as a StatefulSet
# with stable per-pod hostnames (mail nodes are not autoscaled —
# see the do-not-do list).
#
# Every `internal/config` env var is exposed under
# `kmailApi.config.*`. Values that should not live in plaintext
# (DB URL, OIDC client secret, Stripe key, etc.) come from the
# referenced Secret instead — see `secret.yaml`.
#
# For multi-region deployments, layer `values-multiregion.yaml` on
# top of this file:
#
#   helm upgrade kmail . -f values.yaml -f values-multiregion.yaml \
#                        --set multiregion.region=us-west-2

# Multi-region topology. When `enabled: true`, the chart wires
# region-aware ingress annotations, KMAIL_REGION env, topology
# spread constraints, and a cross-region Valkey peer list.
# Defaults are no-ops so single-region installs behave exactly
# the way they always have.
multiregion:
  enabled: false
  # Region of THIS deployment (e.g. us-west-2, eu-west-1). Stamped
  # into the KMAIL_REGION env var and into ExternalDNS set
  # identifiers so client-side routing can prefer a region.
  region: ""
  # Base DNS domain (e.g. "kmail.example.com"). The regional
  # hostname is composed as `mail-<region>.<domain>` — so
  # region="us-west-2" + domain="kmail.example.com" yields
  # mail-us-west-2.kmail.example.com. This is distinct from
  # `globalHost` (which is the global failover record, NOT a
  # parent zone of the regional record).
  domain: ""
  # Global hostname that DNS-failovers across regions. Each region
  # publishes its regional record (e.g. mail-us-west-2.kmail.example.com)
  # AND participates in the global record (mail.kmail.example.com).
  globalHost: ""
  # Ordered list of peer region names this region can fail over to.
  # The BFF doesn't actively probe peers — the list is exposed as
  # KMAIL_REGION_PEERS so degraded-mode handlers can surface a
  # readable target URL when the local region is unhealthy.
  peerRegions: []
  # Comma-separated Valkey URLs (one per peer region) for the BFF
  # to replicate rate-limit / circuit-breaker / session state
  # against. Local writes are still primary; peer writes are
  # best-effort fan-out. Empty disables cross-region fan-out.
  valkeyReplicaURLs: ""
  # ExternalDNS provider ("aws", "google", "cloudflare"). Drives
  # which set of provider-specific weighted/failover annotations
  # the ingress template emits. Empty disables ExternalDNS
  # entirely — the ingress remains a plain regional ingress.
  externalDNSProvider: ""
  # Weight for weighted DNS rotation (1–255 typical). Higher =
  # more traffic. Use 0 to drain a region.
  dnsWeight: 100
  # Failover role when a provider supports active-passive
  # (e.g. AWS Route 53). One of "PRIMARY", "SECONDARY", or "".
  failoverRole: ""

image:
  repository: ghcr.io/kennguy3n/kmail-api
  tag: phase-7
  pullPolicy: IfNotPresent

# kmail-api — stateless BFF / control plane.
kmailApi:
  replicaCount: 3
  # Spread pods across availability zones (and, when multi-region
  # is on, regions) so a single AZ / region outage doesn't take
  # down every BFF replica.
  topologySpreadConstraints: []
  service:
    type: ClusterIP
    port: 80
    # `targetPort` is the SINGLE SOURCE OF TRUTH for the BFF's
    # listen port in Kubernetes. The deployment templates derive
    # `containerPort` AND the `KMAIL_API_ADDR` env var from this
    # value, so changing it here updates every dependent surface
    # — there is no separate hardcoded port the operator can
    # accidentally desynchronise. The Service's external `port`
    # is the front-door (`:80`) and is unrelated.
    targetPort: 8080
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: mail.kmail.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  config:
    KMAIL_LOG_FORMAT: "json"
    # NOTE: `KMAIL_API_ADDR` is NOT set here. The BFF binary's
    # in-source default is `:8088` (so a host-run BFF doesn't
    # collide with Stalwart's matched 8080:8080 host publish in
    # docker-compose.yml); in Kubernetes Stalwart is a SEPARATE
    # StatefulSet so the BFF is free to bind `:8080` inside its
    # own pod. The deployment template plants `KMAIL_API_ADDR`
    # as a per-pod `env:` entry derived from
    # `kmailApi.service.targetPort`, so the listen address,
    # `containerPort`, Service `targetPort`, and probe targets
    # are all driven by the SAME value. Do not re-add it here
    # — doing so re-introduces the three-place magic-number
    # drift this refactor was meant to eliminate.
    #
    # Default Stalwart upstream is plain HTTP on the `jmap` port
    # for legacy / dev clusters. When `mtls.enabled=true` this
    # value is overridden in `deployment-api.yaml` to the
    # cluster.local FQDN on the `jmap-tls` port (8443), so that
    # SNI matches one of the SANs cert-manager bakes into the
    # server cert (`stalwart-mtls.yaml`).
    #
    # IMPORTANT: the default hostname uses the bare `.svc` short
    # form — this is NOT in the SAN list the chart generates.
    # If you override this value with mtls.enabled=true, the
    # hostname MUST be either:
    #   (a) the full `<pod>.<headlessSvc>.<ns>.svc.cluster.local`
    #       FQDN (the form `deployment-api.yaml` plugs in), OR
    #   (b) a name covered by `mtls.serverName` if you pin SNI.
    # The BFF logs a defensive WARN at startup if it detects an
    # mTLS + bare-`.svc` hostname mismatch — see `jmap.NewProxy`.
    KMAIL_STALWART_URL: "http://kmail-stalwart-0.kmail-stalwart.svc:8080"
    KMAIL_RETENTION_DRY_RUN: "false"
    KMAIL_TRACING_OTLP_ENDPOINT: ""
    # KMAIL_KCHAT_OIDC_ISSUER and _AUDIENCE MUST be overridden by
    # the deployer for any non-development install. Empty defaults
    # are intentional: leaving them empty causes the BFF to refuse
    # to boot in non-dev (the fail-closed guard in
    # `internal/middleware/auth.go:NewOIDC`), which is the correct
    # signal that a placeholder was not customised. A non-empty
    # placeholder default (e.g. "https://kchat.example.com") would
    # instead cause the JWKS fetcher to try to resolve a domain
    # the deployer never owned, surfacing as a confusing
    # ":80 dial tcp: lookup …" error rather than a clean
    # "OIDC issuer not configured" boot refusal.
    KMAIL_KCHAT_OIDC_ISSUER: ""
    KMAIL_KCHAT_OIDC_AUDIENCE: ""
    KMAIL_LOKI_ENV: "prod"

# kmail-worker — background-worker process (Session 6 decomposition).
# Runs every background worker that kmail-api used to start in-process
# (calendar reminders, undo/scheduled/snooze dispatch, billing quota
# scan, search cutover, deliverability alerts, shard-health, retention,
# export fan-out, admin-proxy expiry, webhooks). It exposes ONLY
# /healthz, /readyz, and /metrics — no tenant traffic — so it has NO
# Service, NO Ingress, and NO HPA. It reuses kmailApi's ConfigMap and
# Secret so both processes read identical config.
#
# INVARIANT: every worker that can run in BOTH kmail-api (when
# KMAIL_DISABLE_WORKERS=false) and kmail-worker MUST be safe under
# concurrent execution — i.e. it claims its unit of work via a Postgres
# advisory/row lock (FOR UPDATE SKIP LOCKED) or a Valkey lease. This is
# what makes running both processes simultaneously, and scaling the
# worker past one replica, safe. Do NOT register an unlocked worker in
# cmd/kmail-worker/workers.go — it would double-execute.
kmailWorker:
  # Single replica by default. The workers coordinate via Postgres
  # advisory/row locks and Valkey (see the INVARIANT above), so a second
  # replica is safe but unnecessary for current throughput; scale up only
  # if a worker's queue backs up (watch the kmail_worker_* metrics).
  replicaCount: 1
  # Health/metrics listen port. Drives the container port,
  # KMAIL_WORKER_ADDR, and both probes in worker-deployment.yaml.
  # Distinct from the API's 8080 so a single-binary dev pod could
  # in principle run both without a port clash.
  metricsPort: 8090
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Stalwart — mail core, deployed as a StatefulSet with stable
# per-pod IPs via spec.subdomain. Mail nodes are explicitly NOT
# autoscaled (see `do-not-do.md`); resize replicaCount manually.
#
# IMPORTANT: when mtls.enabled=true, the server certificate SAN
# list is generated from `replicaCount` at template-render time
# (see templates/stalwart-mtls.yaml). Scaling the StatefulSet
# *without* a corresponding `helm upgrade` will leave the new
# replicas (e.g. stalwart-2, stalwart-3) presenting a certificate
# whose SANs do not include their pod DNS names — BFF→Stalwart
# TLS handshakes to those pods will fail with `x509: certificate
# is valid for X, not Y`. Operational rule: ALWAYS scale via
# `helm upgrade --set stalwart.replicaCount=N`, never via raw
# `kubectl scale statefulset`. See docs/DEVELOPMENT.md
# "Scaling Stalwart with mTLS enabled" for the procedure.
stalwart:
  replicaCount: 2
  image:
    repository: stalwartlabs/stalwart
    tag: v0.16.0
  service:
    headlessName: kmail-stalwart
  storage:
    storageClass: ""
    size: 50Gi
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Secret references. The chart creates a Secret from these values
# only if `secret.create=true`; production deployments should set
# `secret.create=false` and provide an existing Secret (see
# `secret.existingName`) so credentials live in your secret store.
secret:
  create: true
  existingName: ""
  data:
    KMAIL_DATABASE_URL: "postgres://kmail:kmail@postgres:5432/kmail"
    KMAIL_VALKEY_URL: "redis://valkey:6379"
    KMAIL_KCHAT_OIDC_CLIENT_ID: "kmail"
    KMAIL_KCHAT_OIDC_CLIENT_SECRET: ""
    KMAIL_ZK_FABRIC_S3_URL: "http://zk-fabric:8080"
    KMAIL_ZK_FABRIC_ACCESS_KEY: ""
    KMAIL_ZK_FABRIC_SECRET_KEY: ""
    KMAIL_STRIPE_SECRET_KEY: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# BFF→Stalwart mutual-TLS. Production posture pairs cert-manager
# (issuing short-lived leaf certs) with Reloader (auto-restarting
# pods on Secret rotation). Two Certificate resources are
# rendered when `enabled=true`: one client cert mounted on the
# kmail-api Deployment, one server cert mounted on the Stalwart
# StatefulSet. Both must chain to the same Issuer.
#
# When `enabled=false` (the chart default for backwards-compat
# with existing dev / staging clusters), no Certificate is
# rendered and the BFF speaks plain HTTP to Stalwart's :8080
# port. This matches the legacy trusted-network posture.
mtls:
  enabled: false
  # Reference to an existing cert-manager Issuer / ClusterIssuer.
  # Production deployments are expected to point this at the
  # internal PKI (e.g., a Vault-backed Issuer); kind / minikube
  # clusters can use cert-manager's built-in `selfsigned` issuer
  # for smoke testing.
  issuerRef:
    name: ""
    kind: ClusterIssuer
  # Certificate lifetime. Short rotations are the point of
  # cert-manager — the default is one day with an 8h renewal
  # window so a single rollout can absorb a stuck Issuer without
  # an outage.
  duration: 24h
  renewBefore: 8h
  # SNI / `tls.Config.ServerName` value the BFF uses when
  # presenting the upstream certificate. Defaults to the
  # StalwartURL host (parsed by the proxy); set explicitly if
  # KMAIL_STALWART_URL goes through a pod-local sidecar or
  # otherwise diverges from the cert DNSName.
  serverName: ""
