# KMail — staging values overlay.
#
# Layered on top of values.yaml by .github/workflows/deploy-staging.yml:
#   helm upgrade --install kmail deploy/helm/kmail \
#     -f deploy/helm/kmail/values.yaml -f deploy/helm/kmail/values-staging.yaml
#
# Staging mirrors production topology at reduced scale and turns on the
# observability stack so dashboards/alerts are exercised before prod.

kmailApi:
  replicaCount: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

stalwart:
  replicaCount: 2
  storage:
    size: 20Gi

# Production hardening features ON in staging so they're validated here
# first. mTLS uses the staging cert-manager issuer.
mtls:
  enabled: true
  issuerRef:
    name: kmail-internal-ca-staging

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true
  slo:
    availabilityTarget: 0.995

grafanaDashboards:
  enabled: true
