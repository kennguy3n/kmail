apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kmail.fullname" . }}-api
  labels:
    {{- include "kmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.kmailApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "kmail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "kmail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "kmail.serviceAccountName" . }}
      {{- with .Values.kmailApi.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kmail-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              # Templated from `kmailApi.service.targetPort` so the
              # container's listen port, the Service `targetPort`,
              # and the `KMAIL_API_ADDR` env var below are all
              # driven by ONE value in `values.yaml`. Operators can
              # change the BFF's port by editing exactly one line.
              containerPort: {{ .Values.kmailApi.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kmail.fullname" . }}-config
            - secretRef:
                name: {{ include "kmail.secretName" . }}
          {{- /*
            Two surfaces want to inject env vars into the kmail-api
            container: the unconditional KMAIL_API_ADDR (so the
            container's listen address is driven by the same value
            as `containerPort` above and the Service `targetPort`),
            and the conditional multi-region block (per-pod replica
            routing). YAML forbids duplicate mapping keys, and Go's
            parser (used by Helm AND by the kube-apiserver during
            admission) silently drops all but the LAST `env:` it
            sees, so the two blocks MUST live under a single `env:`
            mapping. Putting them in two separate `env:` keys would
            silently drop KMAIL_API_ADDR whenever multiregion is
            enabled, leaving the binary on its in-source default
            (`:8088`) while the Service targets the value of
            `kmailApi.service.targetPort` — readiness probes would
            then never succeed.
          */ -}}
          {{- $mr := .Values.multiregion }}
          {{- $needMR := and $mr.enabled (or $mr.region $mr.peerRegions $mr.valkeyReplicaURLs) }}
          env:
            # `KMAIL_API_ADDR` is NOT placed in the ConfigMap
            # (`values.yaml: kmailApi.config`) because it must
            # be derived from the same value the deployment uses
            # for `containerPort` above. A static ConfigMap entry
            # would let the two drift; this per-pod env keeps
            # them in lock-step. The binary's in-source default
            # is `:8088` (see `internal/config/config.go`) so a
            # host-run BFF avoids the docker-compose 8080 host
            # publish; in Kubernetes Stalwart is its own pod, so
            # the BFF binds whatever this value says (`:8080` by
            # default).
            - name: KMAIL_API_ADDR
              value: ":{{ .Values.kmailApi.service.targetPort }}"
            {{- if $needMR }}
            {{- with $mr.region }}
            - name: KMAIL_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with $mr.peerRegions }}
            - name: KMAIL_REGION_PEERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $mr.valkeyReplicaURLs }}
            - name: KMAIL_VALKEY_REPLICA_URLS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kmailApi.resources | nindent 12 }}
