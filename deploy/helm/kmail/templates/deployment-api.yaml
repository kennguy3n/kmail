apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kmail.fullname" . }}-api
  labels:
    {{- include "kmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.kmailApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "kmail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "kmail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if .Values.mtls.enabled }}
      annotations:
        # When cert-manager rotates the underlying Secret the pod
        # is restarted so the new keypair gets picked up. The
        # Reloader controller (https://github.com/stakater/Reloader)
        # is the recommended way to surface this; the annotation
        # is a no-op if Reloader is not installed.
        reloader.stakater.com/auto: "true"
        secret.reloader.stakater.com/reload: "{{ include "kmail.fullname" . }}-stalwart-client-tls"
      {{- end }}
    spec:
      serviceAccountName: {{ include "kmail.serviceAccountName" . }}
      {{- with .Values.kmailApi.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "kmail.topologySpreadConstraints" (dict "root" $ "component" "api" "constraints" .) | nindent 8 }}
      {{- end }}
      containers:
        - name: kmail-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              # Templated from `kmailApi.service.targetPort` so the
              # container's listen port, the Service `targetPort`,
              # and the `KMAIL_API_ADDR` env var below are all
              # driven by ONE value in `values.yaml`. Operators can
              # change the BFF's port by editing exactly one line.
              containerPort: {{ .Values.kmailApi.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kmail.fullname" . }}-config
            - secretRef:
                name: {{ include "kmail.secretName" . }}
          {{- /*
            Three surfaces want to inject env vars into the kmail-api
            container:
              (1) the unconditional `KMAIL_API_ADDR` so the binary's
                  listen address is templated from the same
                  `kmailApi.service.targetPort` value that drives
                  `containerPort` above and the Service `targetPort`
                  — the three MUST agree or readiness probes fail
                  silently;
              (2) Phase A's mTLS block (BFF→Stalwart HTTPS over the
                  cert-manager-issued client keypair); and
              (3) Phase C's multi-region block (per-pod replica
                  routing).
            YAML forbids duplicate mapping keys, and Go's parser
            (used by Helm AND by the kube-apiserver during admission)
            silently drops all but the LAST `env:` it sees, so all
            three blocks MUST live under a single `env:` mapping.
            Because `KMAIL_API_ADDR` is unconditional, the `env:`
            key itself is always emitted — Gatekeeper / Kyverno
            policies that reject `env: null` are unaffected since
            the key always has at least one child entry.
          */ -}}
          {{- $mr := .Values.multiregion }}
          {{- $needMR := and $mr.enabled (or $mr.region $mr.peerRegions $mr.valkeyReplicaURLs) }}
          env:
            # `KMAIL_API_ADDR` is NOT placed in the ConfigMap
            # (`values.yaml: kmailApi.config`) because it must be
            # derived from the same value the deployment uses for
            # `containerPort` above. A static ConfigMap entry would
            # let the two drift; this per-pod env keeps them in
            # lock-step. The binary's in-source default is `:8088`
            # (see `internal/config/config.go`) so a host-run BFF
            # avoids the docker-compose 8080 host publish; in
            # Kubernetes Stalwart is its own pod, so the BFF binds
            # whatever this value says (`:8080` by default).
            - name: KMAIL_API_ADDR
              value: ":{{ .Values.kmailApi.service.targetPort }}"
            # Pin the in-process workers OFF here, mirroring the
            # defensive pin in worker-deployment.yaml. The binary's
            # in-source default is already `true`, but `env:` wins
            # over the shared ConfigMap carried in `envFrom` above, so
            # this makes the intent explicit and immune to ConfigMap
            # drift: if an operator ever adds `KMAIL_DISABLE_WORKERS:
            # "false"` to the chart's ConfigMap (e.g. to flip the
            # binary into single-binary dev mode), the dedicated
            # kmail-worker Deployment would otherwise start running the
            # same workers as the API, double-processing every job.
            # This per-pod pin keeps the API worker-free regardless of
            # ConfigMap contents; single-binary mode is opted into by
            # NOT deploying the worker and setting the flag elsewhere.
            - name: KMAIL_DISABLE_WORKERS
              value: "true"
            {{- if .Values.mtls.enabled }}
            {{- $stalwartUrl := include "kmail.stalwartMtlsUrl" . }}
            {{- if $stalwartUrl }}
            # When mTLS is enabled the BFF MUST speak HTTPS on Stalwart's
            # `jmap-tls` listener (8443) using a hostname that is a SAN on
            # the server cert (see stalwart-mtls.yaml). kmail.stalwartMtlsUrl
            # synthesizes that hostname for BOTH the in-chart fleet
            # (stalwart.enabled) AND an external fleet a control-plane-only
            # release targets (stalwart.external.enabled, e.g. the canary),
            # so we never hand-build a fragile URL string. It returns ""
            # when the operator supplies KMAIL_STALWART_URL via the ConfigMap
            # instead, in which case we emit no override and the value flows
            # from envFrom. `env:` takes precedence over the ConfigMap value.
            - name: KMAIL_STALWART_URL
              value: {{ $stalwartUrl | quote }}
            {{- end }}
            - name: KMAIL_STALWART_TLS_CERT
              value: /etc/kmail/tls/stalwart-client/tls.crt
            - name: KMAIL_STALWART_TLS_KEY
              value: /etc/kmail/tls/stalwart-client/tls.key
            - name: KMAIL_STALWART_TLS_CA
              value: /etc/kmail/tls/stalwart-client/ca.crt
            {{- with .Values.mtls.serverName }}
            - name: KMAIL_STALWART_TLS_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $needMR }}
            {{- with $mr.region }}
            - name: KMAIL_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with $mr.peerRegions }}
            - name: KMAIL_REGION_PEERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $mr.valkeyReplicaURLs }}
            - name: KMAIL_VALKEY_REPLICA_URLS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: stalwart-client-tls
              mountPath: /etc/kmail/tls/stalwart-client
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kmailApi.resources | nindent 12 }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: stalwart-client-tls
          secret:
            secretName: {{ include "kmail.fullname" . }}-stalwart-client-tls
            defaultMode: 0400
      {{- end }}
