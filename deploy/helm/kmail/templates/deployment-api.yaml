apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kmail.fullname" . }}-api
  labels:
    {{- include "kmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.kmailApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "kmail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "kmail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if .Values.mtls.enabled }}
      annotations:
        # When cert-manager rotates the underlying Secret the pod
        # is restarted so the new keypair gets picked up. The
        # Reloader controller (https://github.com/stakater/Reloader)
        # is the recommended way to surface this; the annotation
        # is a no-op if Reloader is not installed.
        reloader.stakater.com/auto: "true"
        secret.reloader.stakater.com/reload: "{{ include "kmail.fullname" . }}-stalwart-client-tls"
      {{- end }}
    spec:
      serviceAccountName: {{ include "kmail.serviceAccountName" . }}
      {{- with .Values.kmailApi.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kmail-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kmail.fullname" . }}-config
            - secretRef:
                name: {{ include "kmail.secretName" . }}
          {{- /*
            Two surfaces want to inject env vars into the kmail-api
            container: Phase A's mTLS block (BFF→Stalwart HTTPS over
            the cert-manager-issued client keypair) and Phase C's
            multi-region block (per-pod replica routing).  YAML
            forbids duplicate mapping keys, and Go's parser silently
            drops all but the LAST `env:` it sees, so the two
            blocks MUST live under a single `env:` mapping.  The
            outer `{{- if }}` skips the key entirely when neither
            feature is enabled — emitting `env:` with no children
            renders `env: null`, which strict admission webhooks
            (Gatekeeper / Kyverno default policies) reject.
          */ -}}
          {{- $mr := .Values.multiregion }}
          {{- $needMR := and $mr.enabled (or $mr.region $mr.peerRegions $mr.valkeyReplicaURLs) }}
          {{- if or .Values.mtls.enabled $needMR }}
          env:
            {{- if .Values.mtls.enabled }}
            # When mTLS is enabled the BFF MUST speak HTTPS on
            # Stalwart's `jmap-tls` listener (port 8443), and the
            # hostname MUST be one of the SANs cert-manager baked
            # into the server certificate (see stalwart-mtls.yaml).
            # The .svc-only short form is NOT in the SAN list, so
            # we override KMAIL_STALWART_URL here with the FQDN
            # form. `env:` takes precedence over the ConfigMap
            # value carried in envFrom.
            - name: KMAIL_STALWART_URL
              value: {{ printf "https://%s-stalwart-0.%s.%s.svc.cluster.local:8443" (include "kmail.fullname" .) .Values.stalwart.service.headlessName .Release.Namespace | quote }}
            - name: KMAIL_STALWART_TLS_CERT
              value: /etc/kmail/tls/stalwart-client/tls.crt
            - name: KMAIL_STALWART_TLS_KEY
              value: /etc/kmail/tls/stalwart-client/tls.key
            - name: KMAIL_STALWART_TLS_CA
              value: /etc/kmail/tls/stalwart-client/ca.crt
            {{- with .Values.mtls.serverName }}
            - name: KMAIL_STALWART_TLS_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $needMR }}
            {{- with $mr.region }}
            - name: KMAIL_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with $mr.peerRegions }}
            - name: KMAIL_REGION_PEERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $mr.valkeyReplicaURLs }}
            - name: KMAIL_VALKEY_REPLICA_URLS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: stalwart-client-tls
              mountPath: /etc/kmail/tls/stalwart-client
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kmailApi.resources | nindent 12 }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: stalwart-client-tls
          secret:
            secretName: {{ include "kmail.fullname" . }}-stalwart-client-tls
            defaultMode: 0400
      {{- end }}
