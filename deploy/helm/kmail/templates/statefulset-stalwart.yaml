apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.stalwart.service.headlessName }}
  labels:
    {{- include "kmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: stalwart
spec:
  clusterIP: None
  selector:
    {{- include "kmail.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: stalwart
  ports:
    - name: jmap
      port: 8080
    {{- if .Values.mtls.enabled }}
    - name: jmap-tls
      port: 8443
    {{- end }}
    - name: smtp
      port: 25
    - name: imap
      port: 143
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kmail.fullname" . }}-stalwart
  labels:
    {{- include "kmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: stalwart
spec:
  serviceName: {{ .Values.stalwart.service.headlessName }}
  replicas: {{ .Values.stalwart.replicaCount }}
  selector:
    matchLabels:
      {{- include "kmail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stalwart
  template:
    metadata:
      labels:
        {{- include "kmail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stalwart
      {{- if .Values.mtls.enabled }}
      # cert-manager rotates the underlying Secret in place. Pods
      # are rotated by the Reloader controller so they pick up
      # the new server keypair without manual intervention.
      annotations:
        reloader.stakater.com/auto: "true"
        secret.reloader.stakater.com/reload: "{{ include "kmail.fullname" . }}-stalwart-server-tls"
      {{- end }}
    spec:
      # `subdomain` pairs with the headless service name above so
      # each pod gets a stable DNS entry of the form
      # <pod-name>.<service>.<namespace>.svc.cluster.local. The
      # BFF resolves a tenant's primary shard to that hostname.
      subdomain: {{ .Values.stalwart.service.headlessName }}
      {{- with .Values.stalwart.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: stalwart
          image: "{{ .Values.stalwart.image.repository }}:{{ .Values.stalwart.image.tag }}"
          ports:
            - name: jmap
              containerPort: 8080
            {{- if .Values.mtls.enabled }}
            - name: jmap-tls
              containerPort: 8443
            {{- end }}
            - name: smtp
              containerPort: 25
            - name: imap
              containerPort: 143
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.mtls.enabled }}
            - name: server-tls
              mountPath: /etc/stalwart/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.stalwart.resources | nindent 12 }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: server-tls
          secret:
            secretName: {{ include "kmail.fullname" . }}-stalwart-server-tls
            defaultMode: 0400
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.stalwart.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.stalwart.storage.size }}
