# Prometheus scrape config for the local KMail dev stack.
#
# The BFF (`cmd/kmail-api`) registers the Prometheus collectors in
# `internal/middleware/metrics.go` and exposes `/metrics` on the
# same HTTP port as the REST/JMAP surface. Keep the scrape interval
# aggressive in dev so we see tenant lifecycle events land on the
# `kmail_active_tenants` / `kmail_seats_total` gauges within a few
# seconds of the change.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# WS4 Task 8 — alerting rules (see alerts.yml). In the dev compose
# stack the file is mounted at this path; in production it ships in
# the same ConfigMap as this scrape config.
rule_files:
  - /etc/prometheus/alerts.yml

# Route firing alerts to Alertmanager, which fans out to
# PagerDuty/Opsgenie per alertmanager.tmpl.yml. Commented out by
# default so the dev stack doesn't require an Alertmanager container;
# uncomment (and run one) to exercise the routing locally.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "kmail-api"
    metrics_path: /metrics
    # The BFF runs on the host during `make dev`; from inside the
    # compose network Prometheus reaches it via the Docker host
    # gateway. The port matches the BFF's default `KMAIL_API_ADDR`
    # (`:8088`) — host port 8080 is taken by Stalwart in compose,
    # so the BFF binds elsewhere on the host (see
    # internal/config/config.go HTTPConfig.Addr). In production
    # the static_config becomes a proper service-discovery entry.
    static_configs:
      - targets:
          - "host.docker.internal:8088"

  # The background workers run out-of-process (cmd/kmail-worker) by
  # default — kmail-api sets KMAIL_DISABLE_WORKERS=true — so the
  # worker-side series (kmail_worker_* supervisor health, plus the
  # job counters the workers own: kmail_export_*,
  # kmail_search_cutover_*, kmail_admin_sessions_expired_total,
  # retention runs, deliverability alerts) are exposed on the
  # worker's own /metrics, NOT the BFF target above. Scrape it here.
  # :8090 is KMAIL_WORKER_ADDR's default; reachable on the host
  # whether the worker runs via `./bin/kmail-worker` or the compose
  # `workers` profile (which publishes 8090:8090).
  - job_name: "kmail-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8090"
