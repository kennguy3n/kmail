# OWASP ZAP baseline scan rule configuration for KMail.
#
# Format: <ruleId>	<action>	<comment>
#   action = WARN | FAIL | IGNORE
#
# Consumed by zap-baseline.sh (-c). The baseline scan is passive
# (it does not attack), so this file mainly promotes the headers we
# now enforce in internal/middleware/security.go from WARN to FAIL,
# and silences rules that are not applicable to a token-authenticated
# JSON API.

# --- Security headers we enforce: FAIL if missing/weak ---
10035	FAIL	Strict-Transport-Security header (enforced in security.go)
10038	FAIL	Content-Security-Policy header (enforced, strict, no inline)
10020	FAIL	X-Frame-Options / anti-clickjacking (DENY)
10021	FAIL	X-Content-Type-Options: nosniff
10063	FAIL	Permissions-Policy (camera/mic/geolocation disabled)
10037	WARN	Server / version disclosure

# --- Not applicable to a token-auth JSON API: IGNORE ---
10054	IGNORE	Cookie without SameSite (API uses Bearer tokens, not cookies)
10010	IGNORE	Cookie no HttpOnly flag (no auth cookies)
90033	IGNORE	Loosely-scoped cookie

# --- Informational ---
10096	WARN	Timestamp disclosure
10027	WARN	Information disclosure - suspicious comments
