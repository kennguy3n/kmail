# Gradle properties for the KMail Android SDK shell.
#
# These properties tune Gradle's JVM and AndroidX behaviour. They
# apply to every module in the build.

# Use the AndroidX support libraries (the modern, supported set).
# Set to `true` once and never set back to `false` — the older
# `android.support.*` libraries are deprecated.
android.useAndroidX=true

# AGP 8+ requires Java 17 minimum. The Gradle JVM toolchain
# (auto-resolved by the `jvmToolchain(17)` block in the module
# build files) will install JDK 17 on the host if needed.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Parallel project execution. Safe because we only have one
# library module + no inter-module deps, but the property is set
# explicitly so future module additions inherit the right value.
org.gradle.parallel=true
org.gradle.caching=true

# Quieter logs in CI (warnings still surface; debug output
# doesn't). The build script's own echo lines stay visible.
org.gradle.warning.mode=summary

# Disable build features we don't use, to keep the configuration
# graph minimal. `buildConfig` generates a per-module
# `BuildConfig.java` we don't need; `resValues` synthesises
# resource constants we don't need.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.aidl=false
